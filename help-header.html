<style>
  :root {
    --accent: #129a4d;
    --accent-dark: #0d7a3c;
    --code-bg: #f6f8fa;
    --code-border: #e1e4e8;
    --toc-bg: #f6fbf8;
    --toc-border: #d9ede1;
  }
  body {
    max-width: 46em;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    line-height: 1.65;
  }
  h1, h2, h3, h4 {
    line-height: 1.3;
  }
  h1 {
    font-size: 1.9em;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 0.3em;
  }
  h2 {
    font-size: 1.4em;
    color: var(--accent-dark);
    border-bottom: 1px solid var(--code-border);
    padding-bottom: 0.2em;
  }
  h3 {
    font-size: 1.15em;
  }
  a {
    color: var(--accent-dark);
    text-decoration: none;
  }
  a:hover, a:visited:hover {
    text-decoration: underline;
  }
  a:visited {
    color: var(--accent-dark);
  }
  #TOC {
    background: var(--toc-bg);
    border: 1px solid var(--toc-border);
    border-radius: 8px;
    padding: 0.9em 1.4em;
    margin: 1.5em 0 2em;
  }
  #TOC #toc-title {
    margin-top: 0;
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #4a6b58;
    border-bottom: none;
  }
  code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 4px;
    padding: 0.1em 0.35em;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 0.9em 1.1em;
  }
  pre code {
    background: none;
    border: none;
    padding: 0;
  }
  img {
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    display: block;
    margin: 1em auto;
  }
  hr {
    border-top: 1px solid var(--code-border);
    background: none;
    height: 0;
    margin: 2em 0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #2fbf71;
      --accent-dark: #4fd98a;
      --code-bg: #1e2530;
      --code-border: #333d4a;
      --toc-bg: #16241d;
      --toc-border: #234433;
    }
    html {
      color: #d8dee4;
      background-color: #14171a;
    }
    a, a:visited {
      color: var(--accent-dark);
    }
    #TOC #toc-title {
      color: #9fc2ac;
    }
    blockquote {
      color: #9aa4b0;
    }
    hr {
      background: #333d4a;
    }
    img {
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
  }
</style>
